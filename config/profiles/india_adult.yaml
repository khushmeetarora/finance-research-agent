# India - adult investor, no restrictions.
# Tax rates current as of FY 2025-26 / FY 2026-27 (post Finance Act 2024).
# Update annually; do not hardcode in Python.

profile_id: india_adult
display_name: "India - Adult (no restrictions)"
country: IN
currency: INR
locale: en_IN

universe:
  default: NIFTY500
  available: [NIFTY50, NIFTY500, BSE500, GLOBAL_LARGE]
  yahoo_suffix: ".NS"        # default suffix for NSE tickers on yfinance
  alt_yahoo_suffix: ".BO"    # BSE fallback

factor_weights:
  quality: 0.30
  value: 0.25
  momentum: 0.25       # India adult slightly tilts to momentum (vs default 0.20)
  financial_health: 0.12
  earnings_quality: 0.08

factor_config:
  # Picks with any factor below this floor are flagged (not auto-rejected).
  per_factor_floor: 0.20
  # Coverage-weight floor: a snapshot with 0% coverage still gets this much
  # weight, capped above by 1.0 at 100% coverage. Penalises sparse data.
  coverage_weight_floor: 0.4
  # Optional: residualise Earnings Quality against Quality to avoid
  # double-counting overlapping concepts.
  orthogonalize_eq: false

# Simple after-tax return estimator (used for the Picks sheet).
return_model:
  base_annual_return: 0.10                # equity premium proxy
  composite_to_return_slope: 0.04         # composite=1 -> +4% over base
  transaction_cost_bps: 15                # round-trip frictional cost

risk_constraints:
  min_market_cap_inr_crore: 1000     # >= INR 1000 cr (~ small-mid cap floor)
  max_single_position_pct: 0.10
  prefer_etf: false
  max_volatility_annualized: 0.60

tax:
  # Listed equity / equity-oriented mutual funds.
  short_term_threshold_days: 365
  short_term_rate: 0.20                       # STCG flat 20% (Section 111A)
  long_term_rate: 0.125                       # LTCG 12.5% above exemption (Section 112A)
  long_term_annual_exemption_inr: 125000      # Rs 1.25 lakh / FY
  prefer_long_term_holding: true              # nudges manager toward >12m theses
  notes:
    - "Rates apply to transfers on/after 23 July 2024."
    - "Cess of 4% applies on tax computed."
    - "Carry-forward: short-term losses 8 years; LTCG losses only offset LTCG."

llm:
  prompt_locale_hints:
    - "User invests from India; quote prices in INR (Rs / lakh / crore)."
    - "Reference NSE/BSE conventions (e.g. INFY for Infosys, RELIANCE for Reliance)."
