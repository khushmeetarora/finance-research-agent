# Global / US - Multibagger Quality Score (V2 variant), added to support a
# US/global single-name + peer-set run (e.g. Alphabet/GOOGL) that the shipped
# India/Germany profiles cannot express cleanly:
#   * india_multibagger appends ".NS"  -> would corrupt GOOGL -> GOOGL.NS
#   * germany_student   appends ".DE"  -> would corrupt GOOGL -> GOOGL.DE
# This profile therefore uses an EMPTY yahoo_suffix so bare US symbols
# (GOOGL, AAPL, ...) reach yfinance verbatim, and reuses the exact 7-pillar
# multibagger weights / factor_config from india_multibagger so the scorer is
# identical - only currency/suffix/universe differ. Nothing in src/ is changed.

profile_id: global_multibagger
display_name: "Global - Multibagger Quality Score (V2)"
country: US
currency: USD
locale: en_US

# Selects the 7-pillar pillar engine + veto pass in src/agents/quant.py.
scoring_mode: multibagger

universe:
  default: GLOBAL_LARGE
  available: [GLOBAL_LARGE]
  yahoo_suffix: ""            # US tickers carry no exchange suffix on yfinance
  alt_yahoo_suffix: ""

# 7-pillar weights - copied verbatim from india_multibagger (spec section 4).
pillar_weights:
  profitability: 0.22
  earnings_quality: 0.18
  balance_sheet_safety: 0.15
  growth_valuation: 0.15
  moat_pricing_power: 0.12
  promoter_governance: 0.10
  rerating_catalysts: 0.08

# Retained for any classic-path fallback; ignored in multibagger mode.
factor_weights:
  quality: 0.30
  value: 0.25
  momentum: 0.20
  financial_health: 0.15
  earnings_quality: 0.10

factor_config:
  sector_relative: true
  min_sector_peers: 6
  cyclical_mode: false
  coverage_weight_floor: 0.4
  per_factor_floor: 0.20

manual_inputs: {}

return_model:
  base_annual_return: 0.08
  composite_to_return_slope: 0.04
  transaction_cost_bps: 10

risk_constraints:
  # Global large-cap floor (USD millions). All GLOBAL_LARGE names clear it.
  min_market_cap_eur_million: 5000
  max_single_position_pct: 0.10
  prefer_etf: false
  max_volatility_annualized: 0.80

tax:
  # Generic US long-term capital-gains stub (informational; does not affect
  # the pillar scores, only the after-tax return estimate / report notes).
  short_term_threshold_days: 365
  short_term_rate: 0.37
  long_term_rate: 0.20
  prefer_long_term_holding: true
  notes:
    - "US LTCG (>1yr) 0/15/20% by bracket; 20% assumed. Plus 3.8% NIIT possible."
    - "Rates are informational only; not tax advice."

llm:
  prompt_locale_hints:
    - "User screens global/US large caps; quote prices in USD."
    - "Reference US exchange tickers (e.g. GOOGL/GOOG for Alphabet, AAPL for Apple)."
    - "This is a MULTIBAGGER-quality screen: emphasise consistency of ROCE/FCF, earnings quality (cash-backed profits), balance-sheet safety, and honest valuation (PEG within sector). Never treat a single peak-year metric as a buy signal."
